version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Das Icon-Subset (ADR 0009) parst Font-Awesome-Regeln der Form `.fa-x:before{content:...}`.
      # Ab 6.7 steht der Glyph in `--fa:...`, das Skript fände 0 Icons; Major wie Minor bleiben gepinnt.
      - dependency-name: '@fortawesome/fontawesome-free'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
