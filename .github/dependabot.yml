version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Das Icon-Subset (ADR 0009) liest beide Formate (`:before{content:...}` bis 6.6, `--fa:...` ab 6.7),
      # Minor-Updates laufen deshalb wieder. Font Awesome 7 bleibt gesperrt: neue Klassennamen und
      # Font-Familien, die Seiten nutzen bewusst nur FA-6-Namen (CLAUDE.md). Wiedervorlage 2027-01-31.
      - dependency-name: '@fortawesome/fontawesome-free'
        update-types: ['version-update:semver-major']
      # Playwright 1.64 macht in der CI die WebKit-Specs auf portfolio.html rot (Klick wartet ewig auf
      # "stable"); lokal reproduzierbar nicht. Bis die Ursache geklärt ist, bleibt 1.63 exakt gepinnt.
      # Wiedervorlage: bei jedem neuen Playwright-Minor die WebKit-Specs lokal und in einem Test-PR prüfen,
      # spätestens bis 2027-01-31 entscheiden, ob die Regel entfällt.
      - dependency-name: '@playwright/test'
        versions: ['>=1.64.0']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
