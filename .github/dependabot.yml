version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Das Icon-Subset (ADR 0009) parst Font-Awesome-Regeln der Form `.fa-x:before{content:...}`.
      # Ab 6.7 steht der Glyph in `--fa:...`, das Skript fände 0 Icons; Major wie Minor bleiben gepinnt.
      # Wiedervorlage: entfällt, sobald `scripts/subset_fontawesome.js` das neue Format liest (ADR 0009); spätestens
      # bis 2027-01-31 prüfen.
      - dependency-name: '@fortawesome/fontawesome-free'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Playwright 1.64 macht in der CI die WebKit-Specs auf portfolio.html rot (Klick wartet ewig auf
      # "stable"); lokal reproduzierbar nicht. Bis die Ursache geklärt ist, bleibt 1.63 exakt gepinnt.
      # Wiedervorlage: bei jedem neuen Playwright-Minor die WebKit-Specs lokal und in einem Test-PR prüfen,
      # spätestens bis 2027-01-31 entscheiden, ob die Regel entfällt.
      - dependency-name: '@playwright/test'
        versions: ['>=1.64.0']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'
