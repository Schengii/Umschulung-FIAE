name: Visual Regression

# Referenzbilder müssen unter Linux entstehen (Schrift-Rendering). Ablauf:
#  1. Actions -> Visual Regression -> Run workflow mit "update" = true
#  2. Das Artefakt "visual-snapshots" herunterladen und nach assets/js/modules/visual.spec.js-snapshots/ legen
#  3. Einchecken. Ab dann prüft der Workflow bei jedem Pull Request, der Seiten, Styles oder Skripte ändert.

on:
  workflow_dispatch:
    inputs:
      update:
        description: 'Referenzbilder neu erzeugen (statt zu vergleichen)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'pages/**'
      - 'index.html'
      - 'assets/css/**'
      - 'assets/js/**'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Check for reference images
        id: refs
        run: |
          if ls assets/js/modules/visual.spec.js-snapshots/*-linux.png >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npx playwright install --with-deps chromium
        if: github.event.inputs.update == 'true' || steps.refs.outputs.present == 'true'

      - name: Create reference images
        if: github.event.inputs.update == 'true'
        run: npm run test:visual:update

      - name: Compare with reference images
        if: github.event.inputs.update != 'true' && steps.refs.outputs.present == 'true'
        run: npm run test:visual

      - name: Upload reference images
        if: github.event.inputs.update == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-snapshots
          path: assets/js/modules/visual.spec.js-snapshots/
          if-no-files-found: error

      - name: Upload differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: test-results/
          if-no-files-found: ignore
