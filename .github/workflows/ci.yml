name: Portfolio CI & E2E Quality Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run E2E Test Suite & Data Sync Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Audit Dependencies for Known Vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Browsers (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify Data Synchronization (22 Projects)
        run: npm run check-sync

      - name: Verify <head> Boilerplate Consistency
        run: npm run check-head

      - name: Verify CSP script-src Hashes Match Inline Scripts
        run: npm run check-csp

      - name: Verify Service Worker Precache List Is Up To Date
        run: npm run check-sw-assets

      - name: Lint JavaScript
        run: npm run lint

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Run Vitest Unit Test Suite
        run: npm run test:unit

      - name: Run Playwright E2E Test Suite (Chromium, Firefox, WebKit, Mobile)
        run: npm test

      - name: Verify Production Build (esbuild minify)
        run: npm run build:dist

      - name: JSDoc Type Check (advisory, pre-existing findings not yet triaged)
        run: npm run typecheck
        continue-on-error: true

  lighthouse:
    name: Lighthouse Quality Audit (a11y/SEO/best-practices enforced, performance informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
