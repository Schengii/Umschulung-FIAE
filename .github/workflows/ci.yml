name: Portfolio CI & E2E Quality Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality:
    name: Quality Gates (data sync, CSP, lint, unit tests, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Audit Dependencies for Known Vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Data Synchronization
        run: npm run check-sync

      - name: Verify <head> Boilerplate Consistency
        run: npm run check-head

      - name: Verify CSP script-src Hashes Match Inline Scripts
        run: npm run check-csp

      - name: Verify Service Worker Precache List Is Up To Date
        run: npm run check-sw-assets

      - name: Lint JavaScript
        run: npm run lint

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Run Vitest Unit Test Suite
        run: npm run test:unit

      - name: Verify Production Build (esbuild minify)
        run: npm run build:dist

      - name: JSDoc Type Check
        run: npm run typecheck

  e2e:
    # One job per Playwright project so the browsers run in parallel (a single
    # serial job took ~13 min) and a failure points straight at the browser.
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright E2E Tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse Quality Audit (a11y/SEO/best-practices enforced, performance informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
