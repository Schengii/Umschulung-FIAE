name: CI & Quality Audit Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    name: Build, Sync Check, Playwright E2E & Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Data Synchronization
        run: |
          npm run generate-data
          node scripts/check_data_sync.js

      - name: Run Playwright E2E Tests
        run: npm test

      - name: Lighthouse Automated Performance & Accessibility Audit
        run: |
          npx -y @lhci/cli@0.14.x collect --url="http://localhost:8080/index.html" --url="http://localhost:8080/pages/home.html" --url="http://localhost:8080/pages/portfolio.html" || true

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
