name: Deploy Portfolio to GitHub Pages

# Deploys the site whenever the E2E test suite passes on main.
# NOTE: This workflow only takes effect once "Settings → Pages → Source"
# is set to "GitHub Actions" in the repository settings — it is not
# activated automatically by merging this file.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Run E2E Test Suite before deploying
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Verify Data Synchronization (Projects)
        run: npm run check-sync

      - name: Run Playwright E2E Test Suite
        run: npm test

  deploy:
    name: Publish to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
