name: Automated Subprojects Sync

on:
  schedule:
    # Safety net: Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Manual 1-click trigger via GitHub Actions UI
  repository_dispatch:
    # Automated instant trigger via git pushes in subprojects
    types: [subproject-updated, standalone-push]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Standalone Repositories into Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Subprojects Sync Script
        run: npm run sync-projects

      - name: Open Pull Request if Changes Detected
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sync): automated sync of standalone projects"
          branch: automated/subprojects-sync
          delete-branch: true
          title: "chore(sync): automated sync of standalone projects"
          body: |
            Automated sync of the mapped standalone sub-project repositories (`scripts/sync_projects.js`).

            Triggered by:
            - Instant push event from a subproject (`repository_dispatch`)
            - Daily automated schedule (`cron: '0 4 * * *'`)
            - Manual trigger (`workflow_dispatch`)

            Review the diff and merge once CI is green.
          labels: automated-sync
