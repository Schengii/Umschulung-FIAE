name: Automated Subprojects Sync

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    # Allows manual triggering via GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Standalone Repositories into Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Subprojects Sync Script
        run: npm run sync-projects

      - name: Open Pull Request if Changes Detected
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sync): automated weekly sync of standalone projects"
          branch: automated/subprojects-sync
          delete-branch: true
          title: "chore(sync): automated weekly sync of standalone projects"
          body: |
            Automated weekly sync of the mapped standalone sub-project repositories (`scripts/sync_projects.js`).

            This PR is opened by the `sync.yml` workflow instead of pushing directly to `main`, so the regular
            CI checks (lint, unit tests, E2E tests, data-sync guard) run against the synced changes before they
            merge. Review the diff and merge once CI is green.
          labels: automated-sync
