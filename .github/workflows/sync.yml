name: Automated Subprojects Sync

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    # Allows manual triggering via GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    name: Sync Standalone Repositories into Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Subprojects Sync Script
        run: npm run sync-projects

      - name: Commit and Push if Changes Detected
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected! Committing and pushing..."
            git add -A
            git commit -m "chore(sync): automated weekly sync of standalone projects"
            git push origin main
          else
            echo "No changes found. Subprojects are already up to date."
          fi
