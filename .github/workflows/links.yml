name: External Links

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check external links
        id: links
        continue-on-error: true
        run: node scripts/check_external_links.js --json "$RUNNER_TEMP/dead-links.md"

      - name: Open or update issue for dead links
        if: steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Tote externe Links"
          body="Der wöchentliche Link-Check hat nicht erreichbare Links gefunden (Stand $(date -u +%F)):"$'\n\n'"$(cat "$RUNNER_TEMP/dead-links.md")"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
