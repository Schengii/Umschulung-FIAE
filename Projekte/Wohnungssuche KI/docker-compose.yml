version: '3.8'

services:
  backend:
    build: ./backend
    container_name: wohnungssuche-backend
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production

  frontend:
    build: ./frontend
    container_name: wohnungssuche-frontend
    ports:
      - "5222:5222"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
    driver: local
