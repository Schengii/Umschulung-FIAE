<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Primitive Werte werden beim Zuweisen kopiert, Objekte nur als Referenz: zwei Variablen zeigen danach auf dasselbe Objekt</title>
  <rect width="720" height="280" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4338ca"/></marker></defs>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Wert vs. Referenz in JavaScript</text>
  <g font-family="Fira Code, monospace" font-size="13" fill="#0f172a">
    <text x="30" y="64">let a = 5;</text><text x="30" y="82">let b = a;</text><text x="30" y="100">b = 7;</text>
    <text x="390" y="64">const p = { xp: 5 };</text><text x="390" y="82">const q = p;</text><text x="390" y="100">q.xp = 7;</text>
  </g>
  <g font-size="13">
    <rect x="30" y="126" width="110" height="44" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="85" y="153" text-anchor="middle" font-family="Fira Code, monospace">a: 5</text>
    <rect x="170" y="126" width="110" height="44" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="225" y="153" text-anchor="middle" font-family="Fira Code, monospace">b: 7</text>
    <text x="155" y="200" text-anchor="middle" fill="#047857" font-weight="700">a bleibt 5 – eigene Kopie</text>
    <rect x="390" y="126" width="90" height="44" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="435" y="153" text-anchor="middle" font-family="Fira Code, monospace">p</text>
    <rect x="390" y="190" width="90" height="44" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="435" y="217" text-anchor="middle" font-family="Fira Code, monospace">q</text>
    <rect x="570" y="150" width="130" height="58" rx="10" fill="#fef3c7" stroke="#b45309"/><text x="635" y="176" text-anchor="middle" font-family="Fira Code, monospace">{ xp: 7 }</text><text x="635" y="196" text-anchor="middle" font-size="11" fill="#475569">ein Objekt im Speicher</text>
  </g>
  <g stroke="#4338ca" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M480 148 L568 168"/><path d="M480 212 L568 192"/></g>
  <text x="545" y="258" text-anchor="middle" font-size="13" fill="#be123c" font-weight="700">p.xp ist jetzt auch 7 – beide zeigen auf dasselbe Objekt</text>
  <line x1="350" y1="44" x2="350" y2="240" stroke="#e2e8f0" stroke-width="2"/>
</svg>
