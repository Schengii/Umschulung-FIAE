<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Event Loop: Call Stack, Web APIs, Microtask-Queue und Task-Queue. Nach jeder Aufgabe werden alle Microtasks abgearbeitet, dann kann gerendert werden, dann folgt die nächste Aufgabe.</title>
  <rect width="720" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Event Loop im Browser</text>
  <g font-size="13">
    <rect x="30" y="50" width="170" height="190" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="115" y="74" text-anchor="middle" font-weight="700" fill="#4338ca">Call Stack</text>
    <rect x="50" y="150" width="130" height="30" rx="5" fill="#ffffff" stroke="#4338ca"/><text x="115" y="170" text-anchor="middle" font-family="Fira Code, monospace" font-size="12">handleClick()</text>
    <rect x="50" y="186" width="130" height="30" rx="5" fill="#ffffff" stroke="#4338ca"/><text x="115" y="206" text-anchor="middle" font-family="Fira Code, monospace" font-size="12">main()</text>
    <text x="115" y="98" text-anchor="middle" font-size="11" fill="#475569">synchroner Code,</text>
    <text x="115" y="113" text-anchor="middle" font-size="11" fill="#475569">ein Thread</text>

    <rect x="270" y="50" width="180" height="90" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="360" y="74" text-anchor="middle" font-weight="700">Web APIs (Browser)</text>
    <text x="360" y="96" text-anchor="middle" font-size="12" fill="#475569">Timer, fetch, DOM-Events,</text>
    <text x="360" y="112" text-anchor="middle" font-size="12" fill="#475569">laufen parallel im Hintergrund</text>

    <rect x="500" y="50" width="200" height="80" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="600" y="74" text-anchor="middle" font-weight="700" fill="#047857">Microtask-Queue</text>
    <text x="600" y="96" text-anchor="middle" font-size="12" fill="#0f172a">Promise.then, await,</text>
    <text x="600" y="112" text-anchor="middle" font-size="12" fill="#0f172a">queueMicrotask</text>

    <rect x="500" y="160" width="200" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="600" y="184" text-anchor="middle" font-weight="700" fill="#b45309">Task-Queue</text>
    <text x="600" y="206" text-anchor="middle" font-size="12" fill="#0f172a">setTimeout, setInterval,</text>
    <text x="600" y="222" text-anchor="middle" font-size="12" fill="#0f172a">Klick, Netzwerk-Antwort</text>

    <rect x="270" y="170" width="180" height="60" rx="30" fill="#0f172a"/>
    <text x="360" y="198" text-anchor="middle" font-weight="700" fill="#ffffff">Event Loop</text>
    <text x="360" y="215" text-anchor="middle" font-size="11" fill="#cbd5e1">wartet, bis der Stack leer ist</text>
  </g>
  <g stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M200 90 H268"/>
    <path d="M450 80 H498"/>
    <path d="M450 120 Q480 160 498 190"/>
    <path d="M500 110 Q470 150 452 186"/>
    <path d="M500 205 H452"/>
    <path d="M270 200 H202"/>
  </g>
  <g font-size="13" fill="#0f172a">
    <text x="30" y="272" font-weight="700">Reihenfolge pro Runde:</text>
    <text x="30" y="294">① eine Aufgabe aus der Task-Queue  →  ② ALLE Microtasks (auch neu hinzugekommene)</text>
    <text x="30" y="316">→  ③ ggf. requestAnimationFrame und Rendern  →  wieder ①</text>
  </g>
</svg>
