<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Heimnetz: Geräte mit privaten Adressen hinter einem Router mit öffentlicher Adresse</title>
  <desc id="d">Links drei Geräte im Heimnetz mit privaten IP-Adressen: Smartphone 192.168.178.23, Laptop 192.168.178.24 und Drucker 192.168.178.25. In der Mitte der Router mit der internen Adresse 192.168.178.1, der per DHCP Adressen verteilt und per NAT übersetzt. Rechts das Internet, in dem der Router mit einer öffentlichen Adresse auftritt, hier die Dokumentationsadresse 203.0.113.7, hinter der ein Webserver erreichbar ist.</desc>
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Ein Router verbindet das Heimnetz mit dem Internet</text>
  <rect x="20" y="44" width="260" height="256" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Heimnetz (privat)</text>
  <g text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">
    <rect x="40" y="84" width="220" height="56" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="150" y="108">Smartphone (WLAN)</text><text x="150" y="126" font-weight="400" font-size="12">192.168.178.23</text>
    <rect x="40" y="152" width="220" height="56" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="150" y="176">Laptop (WLAN)</text><text x="150" y="194" font-weight="400" font-size="12">192.168.178.24</text>
    <rect x="40" y="220" width="220" height="56" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="150" y="244">Drucker (LAN-Kabel)</text><text x="150" y="262" font-weight="400" font-size="12">192.168.178.25</text>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <rect x="330" y="104" width="170" height="130" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="415" y="134" font-size="16" font-weight="700">Router</text>
    <text x="415" y="158" font-size="12">intern: 192.168.178.1</text>
    <text x="415" y="180" font-size="12">DHCP: verteilt Adressen</text>
    <text x="415" y="200" font-size="12">NAT: übersetzt Adressen</text>
    <text x="415" y="220" font-size="12">WLAN und Firewall</text>
    <rect x="560" y="84" width="240" height="170" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="680" y="112" font-size="16" font-weight="700">Internet</text>
    <text x="680" y="140" font-size="12">öffentliche Adresse des Routers:</text>
    <text x="680" y="160" font-size="13" font-weight="700">203.0.113.7</text>
    <text x="680" y="182" font-size="11" fill="#475569">(Beispieladresse)</text>
    <rect x="590" y="198" width="180" height="40" rx="8" fill="#ffffff" stroke="#0f766e"/><text x="680" y="222" font-size="12" font-weight="700">Webserver, Mailserver ...</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" fill="none">
    <path d="M260 112 L330 150"/><path d="M260 180 H330"/><path d="M260 248 L330 195"/><path d="M500 170 H560"/>
  </g>
  <g fill="#475569"><polygon points="560,170 550,164 550,176"/><polygon points="500,170 510,164 510,176"/></g>
  <text x="410" y="324" text-anchor="middle" font-size="12" fill="#475569">Private Adressen gelten nur im Heimnetz, nach außen tritt der Router für alle Geräte auf.</text>
</svg>
