<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Hybride Verschlüsselung: Alice verschlüsselt die Nachricht mit einem zufälligen Sitzungsschlüssel (AES) und den Sitzungsschlüssel mit Bobs öffentlichem Schlüssel (RSA). Bob entschlüsselt den Sitzungsschlüssel mit seinem privaten Schlüssel und damit die Nachricht.</title>
  <rect width="720" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Hybride Verschlüsselung (Prinzip von TLS, PGP, S/MIME)</text>
  <text x="110" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Alice (Sender)</text>
  <text x="610" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Bob (Empfänger)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="72" width="160" height="40" rx="8" fill="#f1f5f9" stroke="#475569"/><text x="110" y="97">Nachricht (Klartext)</text>
    <rect x="30" y="140" width="160" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="110" y="165">Sitzungsschlüssel K (zufällig)</text>
    <rect x="250" y="72" width="200" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="350" y="92" font-weight="700">AES mit K</text><text x="350" y="106" font-size="11" fill="#475569">symmetrisch, schnell</text>
    <rect x="250" y="210" width="200" height="40" rx="8" fill="#e0e7ff" stroke="#4338ca"/><text x="350" y="230" font-weight="700">RSA mit Bobs Public Key</text><text x="350" y="244" font-size="11" fill="#475569">asymmetrisch, nur für K</text>
    <rect x="510" y="72" width="190" height="40" rx="8" fill="#f1f5f9" stroke="#475569"/><text x="605" y="97">verschlüsselte Nachricht</text>
    <rect x="510" y="210" width="190" height="40" rx="8" fill="#f1f5f9" stroke="#475569"/><text x="605" y="235">verschlüsselter K</text>
    <rect x="510" y="140" width="190" height="40" rx="8" fill="#ccfbf1" stroke="#0f766e"/><text x="605" y="160" font-weight="700">Bobs Private Key</text><text x="605" y="174" font-size="11" fill="#475569">holt K zurück → entschlüsselt</text>
  </g>
  <g stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M190 92 H248"/>
    <path d="M110 180 V230 H248"/>
    <path d="M190 160 Q300 140 330 114"/>
    <path d="M450 92 H508"/>
    <path d="M450 230 H508"/>
    <path d="M605 210 V182"/>
    <path d="M605 140 V114"/>
  </g>
  <text x="360" y="290" text-anchor="middle" font-size="13" fill="#0f172a">Die große Nachricht wird schnell symmetrisch verschlüsselt, nur der kurze Schlüssel asymmetrisch.</text>
  <text x="360" y="310" text-anchor="middle" font-size="12" fill="#475569">TLS 1.3 vereinbart K statt per RSA per (EC)DHE-Schlüsselaustausch – das Prinzip bleibt gleich.</text>
</svg>
