<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">CSS-Box-Modell: Inhalt, umgeben von Innenabstand (padding), Rahmen (border) und Außenabstand (margin)</title>
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Das CSS-Box-Modell</text>
  <rect x="80" y="44" width="560" height="236" fill="#fef3c7" stroke="#b45309" stroke-dasharray="6 4"/>
  <text x="96" y="66" font-size="14" font-weight="700" fill="#b45309">margin (Außenabstand, transparent)</text>
  <rect x="130" y="80" width="460" height="164" fill="#0f172a"/>
  <text x="146" y="100" font-size="14" font-weight="700" fill="#ffffff">border (Rahmen)</text>
  <rect x="144" y="108" width="432" height="122" fill="#ccfbf1"/>
  <text x="160" y="130" font-size="14" font-weight="700" fill="#0f766e">padding (Innenabstand, hat die Hintergrundfarbe)</text>
  <rect x="210" y="142" width="300" height="70" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="360" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Inhalt (content)</text>
  <text x="360" y="194" text-anchor="middle" font-size="12" fill="#0f172a">width × height</text>
  <g font-size="13" fill="#0f172a">
    <text x="360" y="300" text-anchor="middle">box-sizing: content-box → width gilt nur für den Inhalt (Standard)</text>
    <text x="360" y="316" text-anchor="middle">box-sizing: border-box → width umfasst Inhalt + padding + border (empfohlen)</text>
  </g>
</svg>
