<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Inter-VLAN-Routing: Ein Trunk führt VLAN 10 und VLAN 20 zum Router, der zwischen ihnen routet</title>
  <desc id="d">Zwei Rechner in VLAN 10 und VLAN 20 hängen an einem Switch. Ein Trunk-Port (802.1Q) verbindet den Switch mit einem Router, dessen Subinterfaces das Standardgateway je VLAN bilden.</desc>
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">VLANs und Inter-VLAN-Routing (Router-on-a-Stick)</text>
  <g font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">
    <rect x="20" y="85" width="190" height="56" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="115" y="108">PC A</text><text x="115" y="127" font-size="11" font-weight="400">VLAN 10, 192.168.10.11</text>
    <rect x="20" y="205" width="190" height="56" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="115" y="228">PC B</text><text x="115" y="247" font-size="11" font-weight="400">VLAN 20, 192.168.20.11</text>
    <rect x="320" y="120" width="140" height="100" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="390" y="165">Switch</text><text x="390" y="185" font-size="11" font-weight="400">Access-Ports + Trunk</text>
    <rect x="580" y="105" width="200" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="680" y="140">Router</text>
    <text x="680" y="172" font-size="11" font-weight="400">Gi0/0.10 → 192.168.10.1</text><text x="680" y="194" font-size="11" font-weight="400">Gi0/0.20 → 192.168.20.1</text>
  </g>
  <g stroke="#4338ca" stroke-width="3"><line x1="210" y1="113" x2="320" y2="145"/></g>
  <g stroke="#0f766e" stroke-width="3"><line x1="210" y1="233" x2="320" y2="195"/></g>
  <g stroke="#475569" stroke-width="4"><line x1="460" y1="170" x2="580" y2="170"/></g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="520" y="156">Trunk 802.1Q</text>
    <text x="520" y="192">VLAN-Tags 10 und 20</text>
    <text x="265" y="108" fill="#4338ca" transform="rotate(16 265 108)">Access VLAN 10</text>
    <text x="265" y="245" fill="#0f766e" transform="rotate(-16 265 245)">Access VLAN 20</text>
  </g>
</svg>
