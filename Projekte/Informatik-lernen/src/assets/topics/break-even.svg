<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Break-even-Diagramm: Fixkosten 24.000 Euro, Gesamtkostenlinie und Erlöslinie schneiden sich bei 600 Stück und 29.400 Euro</title>
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Break-even-Point: Kf = 24.000 €, p = 49 €, kv = 9 €</text>
  <!-- Achsen -->
  <g stroke="#0f172a" stroke-width="1.5"><line x1="80" y1="260" x2="680" y2="260"/><line x1="80" y1="260" x2="80" y2="36"/></g>
  <g font-size="11" fill="#475569">
    <text x="80" y="276" text-anchor="middle">0</text><text x="196" y="276" text-anchor="middle">200</text><text x="312" y="276" text-anchor="middle">400</text><text x="428" y="276" text-anchor="middle">600</text><text x="544" y="276" text-anchor="middle">800</text><text x="660" y="276" text-anchor="middle">1.000</text>
    <text x="680" y="296" text-anchor="end">Menge x (Stück)</text>
    <text x="72" y="264" text-anchor="end">0</text><text x="72" y="216" text-anchor="end">10.000</text><text x="72" y="172" text-anchor="end">20.000</text><text x="72" y="128" text-anchor="end">30.000</text><text x="72" y="84" text-anchor="end">40.000</text><text x="72" y="40" text-anchor="end">50.000 €</text>
  </g>
  <g stroke="#e2e8f0"><line x1="80" y1="216" x2="680" y2="216"/><line x1="80" y1="172" x2="680" y2="172"/><line x1="80" y1="128" x2="680" y2="128"/><line x1="80" y1="84" x2="680" y2="84"/></g>
  <!-- Verlust- und Gewinnzone -->
  <polygon points="80,154.4 428,130.64 80,260" fill="#be123c" fill-opacity="0.10"/>
  <polygon points="428,130.64 660,44.4 660,114.8" fill="#047857" fill-opacity="0.14"/>
  <!-- Linien -->
  <line x1="80" y1="154.4" x2="660" y2="154.4" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="80" y1="154.4" x2="660" y2="114.8" stroke="#b45309" stroke-width="3"/>
  <line x1="80" y1="260" x2="660" y2="44.4" stroke="#4338ca" stroke-width="3"/>
  <circle cx="428" cy="130.64" r="6" fill="#0f172a"/>
  <line x1="428" y1="136" x2="428" y2="260" stroke="#0f172a" stroke-dasharray="3 3"/>
  <g font-size="12" font-weight="700">
    <text x="420" y="66" fill="#4338ca">Erlöse E = 49 · x</text>
    <text x="470" y="147" fill="#b45309">Kosten K = 24.000 + 9 · x</text>
    <text x="560" y="172" fill="#475569">Fixkosten Kf</text>
    <text x="436" y="215" fill="#0f172a">BEP: 600 Stück / 29.400 €</text>
    <text x="150" y="200" fill="#be123c">Verlustzone</text>
    <text x="590" y="92" fill="#047857">Gewinn</text>
  </g>
</svg>
