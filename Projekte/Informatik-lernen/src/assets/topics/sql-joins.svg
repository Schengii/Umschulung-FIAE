<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Mengendiagramme der JOIN-Arten: INNER JOIN liefert nur übereinstimmende Zeilen, LEFT JOIN alle Zeilen der linken Tabelle, RIGHT JOIN alle der rechten, FULL OUTER JOIN alle Zeilen beider Tabellen</title>
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">JOIN-Arten: Welche Zeilen kommen ins Ergebnis?</text>
  <defs>
    <clipPath id="l1"><circle cx="70" cy="120" r="48"/></clipPath>
    <clipPath id="l3"><circle cx="430" cy="120" r="48"/></clipPath>
  </defs>
  <g stroke="#0f172a" stroke-width="1.5">
    <!-- INNER -->
    <circle cx="70" cy="120" r="48" fill="#f1f5f9"/><circle cx="130" cy="120" r="48" fill="#f1f5f9"/>
    <circle cx="130" cy="120" r="48" fill="#4338ca" fill-opacity="0.85" clip-path="url(#l1)"/><circle cx="70" cy="120" r="48" fill="none"/>
    <!-- LEFT -->
    <circle cx="310" cy="120" r="48" fill="#f1f5f9"/><circle cx="250" cy="120" r="48" fill="#0f766e" fill-opacity="0.85"/><circle cx="310" cy="120" r="48" fill="none"/>
    <!-- RIGHT -->
    <circle cx="430" cy="120" r="48" fill="#f1f5f9"/><circle cx="490" cy="120" r="48" fill="#b45309" fill-opacity="0.85"/><circle cx="430" cy="120" r="48" fill="none"/>
    <!-- FULL -->
    <circle cx="610" cy="120" r="48" fill="#6d28d9" fill-opacity="0.85"/><circle cx="670" cy="120" r="48" fill="#6d28d9" fill-opacity="0.85"/>
  </g>
  <g font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="58" y="190">A</text><text x="142" y="190">B</text>
    <text x="238" y="190">A</text><text x="322" y="190">B</text>
    <text x="418" y="190">A</text><text x="502" y="190">B</text>
    <text x="598" y="190">A</text><text x="682" y="190">B</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="100" y="60" fill="#4338ca">INNER JOIN</text>
    <text x="280" y="60" fill="#0f766e">LEFT JOIN</text>
    <text x="460" y="60" fill="#b45309">RIGHT JOIN</text>
    <text x="640" y="60" fill="#6d28d9">FULL OUTER JOIN</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="100" y="214">nur Zeilen mit Partner</text>
    <text x="280" y="214">alle aus A, fehlende B</text><text x="280" y="230">als NULL</text>
    <text x="460" y="214">alle aus B, fehlende A</text><text x="460" y="230">als NULL</text>
    <text x="640" y="214">alle aus A und B</text>
  </g>
  <text x="360" y="252" text-anchor="middle" font-size="11" fill="#475569">A = linke Tabelle (nach FROM), B = rechte Tabelle (nach JOIN)</text>
</svg>
