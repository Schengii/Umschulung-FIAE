<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">SQL-Injection: Beim Zusammenbauen per Zeichenkette wird die Eingabe Teil des SQL-Befehls; beim Prepared Statement bleibt sie ein reiner Wert</title>
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Eingabe: ' OR '1'='1</text>
  <rect x="20" y="44" width="330" height="236" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
  <text x="185" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#be123c">✗ Zeichenkette zusammenbauen</text>
  <g font-family="Fira Code, monospace" font-size="12" fill="#0f172a">
    <text x="36" y="100">"SELECT * FROM users</text>
    <text x="36" y="118"> WHERE name = '" + eingabe + "'"</text>
    <text x="36" y="156" fill="#475569">ergibt:</text>
    <text x="36" y="178">SELECT * FROM users</text>
    <text x="36" y="196"> WHERE name = '<tspan fill="#be123c" font-weight="700">' OR '1'='1</tspan>'</text>
  </g>
  <text x="36" y="232" font-size="13" fill="#0f172a">Die Bedingung ist immer wahr →</text>
  <text x="36" y="252" font-size="13" fill="#be123c" font-weight="700">alle Benutzer werden geliefert</text>
  <rect x="370" y="44" width="330" height="236" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="535" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">✓ Prepared Statement</text>
  <g font-family="Fira Code, monospace" font-size="12" fill="#0f172a">
    <text x="386" y="100">"SELECT * FROM users</text>
    <text x="386" y="118"> WHERE name = ?"</text>
    <text x="386" y="140">  + Parameter: eingabe</text>
    <text x="386" y="178" fill="#475569">Datenbank sucht nach dem Namen</text>
    <text x="386" y="196"><tspan fill="#047857" font-weight="700">"' OR '1'='1"</tspan> (wörtlich)</text>
  </g>
  <text x="386" y="232" font-size="13" fill="#0f172a">Befehl und Daten sind getrennt →</text>
  <text x="386" y="252" font-size="13" fill="#047857" font-weight="700">kein Treffer, kein Angriff</text>
</svg>
