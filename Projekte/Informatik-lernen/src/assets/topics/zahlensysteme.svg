<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Stellenwerte der Dualzahl 1010 1101: 128 + 32 + 8 + 4 + 1 = 173, in Hexadezimal AD</title>
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Dualzahl 1010 1101 → Dezimal 173 → Hex AD</text>
  <g font-size="14" text-anchor="middle">
    <text x="60" y="78" fill="#475569" font-weight="600">Stellenwert</text>
    <text x="60" y="128" fill="#475569" font-weight="600">Bit</text>
    <text x="60" y="178" fill="#475569" font-weight="600">Wert</text>
  </g>
  <g font-size="15" text-anchor="middle">
    <!-- obere Hälfte (Nibble 1010) -->
    <rect x="120" y="95" width="64" height="48" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
    <rect x="190" y="95" width="64" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="260" y="95" width="64" height="48" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
    <rect x="330" y="95" width="64" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <!-- untere Hälfte (Nibble 1101) -->
    <rect x="420" y="95" width="64" height="48" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
    <rect x="490" y="95" width="64" height="48" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
    <rect x="560" y="95" width="64" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="630" y="95" width="64" height="48" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
    <g fill="#475569">
      <text x="152" y="78">2⁷ = 128</text><text x="222" y="78">2⁶ = 64</text><text x="292" y="78">2⁵ = 32</text><text x="362" y="78">2⁴ = 16</text>
      <text x="452" y="78">2³ = 8</text><text x="522" y="78">2² = 4</text><text x="592" y="78">2¹ = 2</text><text x="662" y="78">2⁰ = 1</text>
    </g>
    <g font-size="24" font-weight="700" fill="#0f172a">
      <text x="152" y="128">1</text><text x="222" y="128">0</text><text x="292" y="128">1</text><text x="362" y="128">0</text>
      <text x="452" y="128">1</text><text x="522" y="128">1</text><text x="592" y="128">0</text><text x="662" y="128">1</text>
    </g>
    <g fill="#0f172a">
      <text x="152" y="178">128</text><text x="222" y="178">0</text><text x="292" y="178">32</text><text x="362" y="178">0</text>
      <text x="452" y="178">8</text><text x="522" y="178">4</text><text x="592" y="178">0</text><text x="662" y="178">1</text>
    </g>
  </g>
  <text x="360" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">128 + 32 + 8 + 4 + 1 = 173</text>
  <path d="M120 238 h274" stroke="#4338ca" stroke-width="3"/>
  <path d="M420 238 h274" stroke="#0f766e" stroke-width="3"/>
  <text x="257" y="266" text-anchor="middle" font-size="15" fill="#4338ca" font-weight="700">Nibble 1010 = 10 = A</text>
  <text x="557" y="266" text-anchor="middle" font-size="15" fill="#0f766e" font-weight="700">Nibble 1101 = 13 = D</text>
  <text x="360" y="292" text-anchor="middle" font-size="13" fill="#475569">Je 4 Bit (ein Nibble) ergeben genau eine Hexadezimalziffer → 0xAD</text>
</svg>
