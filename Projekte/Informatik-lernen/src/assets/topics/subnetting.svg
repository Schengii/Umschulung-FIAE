<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Das Netz 192.168.10.0/24 wird durch zwei geliehene Bits in vier /26-Subnetze mit je 64 Adressen und 62 nutzbaren Hosts geteilt</title>
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">192.168.10.0/24 → 4 Subnetze /26</text>
  <text x="360" y="52" text-anchor="middle" font-size="13" fill="#475569">2 Bits aus dem Hostteil leihen: 2² = 4 Subnetze, 2⁶ = 64 Adressen, davon 62 für Hosts</text>
  <g font-family="Fira Code, monospace" font-size="14">
    <rect x="40" y="70" width="400" height="34" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="240" y="92" text-anchor="middle" fill="#4338ca">Netzteil: 24 Bit (11111111.11111111.11111111)</text>
    <rect x="440" y="70" width="80" height="34" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="480" y="92" text-anchor="middle" fill="#b45309">+2 Bit</text>
    <rect x="520" y="70" width="160" height="34" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="600" y="92" text-anchor="middle" fill="#0f766e">Host: 6 Bit</text>
  </g>
  <g font-size="13">
    <rect x="40" y="130" width="155" height="130" rx="10" fill="#f8fafc" stroke="#4338ca" stroke-width="2"/>
    <rect x="203" y="130" width="155" height="130" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
    <rect x="366" y="130" width="155" height="130" rx="10" fill="#f8fafc" stroke="#b45309" stroke-width="2"/>
    <rect x="529" y="130" width="155" height="130" rx="10" fill="#f8fafc" stroke="#6d28d9" stroke-width="2"/>
    <g text-anchor="middle" font-weight="700" font-size="14">
      <text x="117" y="152" fill="#4338ca">Subnetz 1</text><text x="280" y="152" fill="#0f766e">Subnetz 2</text>
      <text x="443" y="152" fill="#b45309">Subnetz 3</text><text x="606" y="152" fill="#6d28d9">Subnetz 4</text>
    </g>
    <g text-anchor="middle" fill="#0f172a">
      <text x="117" y="178">Netz .0</text><text x="117" y="200">Hosts .1 – .62</text><text x="117" y="222">Broadcast .63</text>
      <text x="280" y="178">Netz .64</text><text x="280" y="200">Hosts .65 – .126</text><text x="280" y="222">Broadcast .127</text>
      <text x="443" y="178">Netz .128</text><text x="443" y="200">Hosts .129 – .190</text><text x="443" y="222">Broadcast .191</text>
      <text x="606" y="178">Netz .192</text><text x="606" y="200">Hosts .193 – .254</text><text x="606" y="222">Broadcast .255</text>
    </g>
    <g text-anchor="middle" fill="#475569" font-size="12">
      <text x="117" y="248">Maske 255.255.255.192</text><text x="280" y="248">Maske 255.255.255.192</text>
      <text x="443" y="248">Maske 255.255.255.192</text><text x="606" y="248">Maske 255.255.255.192</text>
    </g>
  </g>
  <text x="360" y="288" text-anchor="middle" font-size="13" fill="#475569">Schrittweite (Blockgröße) = 256 − 192 = 64</text>
</svg>
