<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Aufbau eines PCs: CPU, Arbeitsspeicher, Chipsatz, Grafikkarte, NVMe-SSD, SATA und USB mit typischen Datenraten</title>
  <desc id="d">Blockschaubild: Die CPU ist direkt mit dem Arbeitsspeicher (DDR), der Grafikkarte und einer NVMe-SSD über PCIe verbunden. Der Chipsatz hängt an der CPU und bindet SATA-Laufwerke, USB-Anschlüsse und das Netzwerk an.</desc>
  <rect width="780" height="360" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">PC-Aufbau: Komponenten und Verbindungen</text>
  <g stroke="#475569" stroke-width="2">
    <line x1="150" y1="170" x2="340" y2="170"/>
    <line x1="420" y1="170" x2="610" y2="170"/>
    <line x1="380" y1="130" x2="380" y2="82"/>
    <line x1="380" y1="210" x2="380" y2="262"/>
    <line x1="150" y1="300" x2="320" y2="300"/>
    <line x1="440" y1="300" x2="610" y2="300"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="600" fill="#0f172a">
    <rect x="340" y="130" width="80" height="80" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="380" y="176">CPU</text>
    <rect x="60" y="145" width="90" height="50" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="105" y="175">RAM</text>
    <rect x="610" y="145" width="100" height="50" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="660" y="175">GPU</text>
    <rect x="325" y="50" width="110" height="32" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="380" y="71">NVMe-SSD</text>
    <rect x="320" y="262" width="120" height="76" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="380" y="306">Chipsatz</text>
    <rect x="60" y="280" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="105" y="305">SATA</text>
    <rect x="610" y="280" width="110" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="665" y="305">USB, LAN</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="245" y="160">DDR4-3200: 25,6 GB/s je Kanal</text>
    <text x="515" y="160">PCIe x16</text>
    <text x="395" y="100" text-anchor="start">PCIe x4 (3.0: ca. 3,9 GB/s)</text>
    <text x="395" y="240" text-anchor="start">DMI / PCIe-Anbindung</text>
    <text x="235" y="290">SATA III: 6 Gbit/s</text>
    <text x="525" y="290">USB 3.2 Gen 2: 10 Gbit/s</text>
  </g>
</svg>
