<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AGDLP-Prinzip: Konten in globalen Gruppen, diese in domänenlokalen Gruppen, diese erhalten die Berechtigung</title>
  <desc id="d">Vier Stufen von links nach rechts: A für Accounts, G für globale Gruppen, DL für domänenlokale Gruppen und P für die Berechtigung auf eine Ressource wie eine Dateifreigabe.</desc>
  <rect width="800" height="260" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">AGDLP: Rechte über Gruppen vergeben</text>
  <g font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <rect x="20" y="80" width="150" height="90" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="95" y="110" font-size="22">A</text><text x="95" y="135" font-size="13">Accounts</text><text x="95" y="155" font-size="11" font-weight="400">Anna, Ben, Carla</text>
    <rect x="200" y="80" width="160" height="90" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="280" y="110" font-size="22">G</text><text x="280" y="135" font-size="13">Globale Gruppe</text><text x="280" y="155" font-size="11" font-weight="400">G_Vertrieb</text>
    <rect x="390" y="80" width="190" height="90" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="485" y="110" font-size="22">DL</text><text x="485" y="135" font-size="13">Domänenlokale Gruppe</text><text x="485" y="155" font-size="11" font-weight="400">DL_Vertrieb_Lesen</text>
    <rect x="610" y="80" width="170" height="90" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
    <text x="695" y="110" font-size="22">P</text><text x="695" y="135" font-size="13">Permission</text><text x="695" y="155" font-size="11" font-weight="400">Lesen auf der Freigabe</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M170 125 H200"/><path d="M360 125 H390"/><path d="M580 125 H610"/>
  </g>
  <text x="400" y="215" text-anchor="middle" font-size="13" fill="#475569">Konten → Mitglied in globaler Gruppe → Mitglied in domänenlokaler Gruppe → Berechtigung auf der Ressource</text>
</svg>
