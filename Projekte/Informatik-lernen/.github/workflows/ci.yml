name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint (fails on any warning, e.g. undefined JSX references)
        run: npm run lint:ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
