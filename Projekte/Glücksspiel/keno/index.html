<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keno der Elemente | Alchemisten-Akademie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars-overlay"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="game-container">
        <!-- HEADER -->
        <header class="game-header">
            <div class="logo">
                <i class="fa-solid fa-fire-flame-curved magic-icon"></i>
                <div class="logo-text">
                    <h1>KENO DER ELEMENTE</h1>
                    <span>ALCHEMISTISCHE RUNEN-ZIEHUNG</span>
                </div>
            </div>
            
            <div class="header-stats">
                <div class="balance-card">
                    <span class="balance-label">GESAMTGUTHABEN</span>
                    <div class="balance-value">
                        <span id="balance-amount">1000.00</span>
                        <span class="currency">€</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN GAME AREA -->
        <main class="keno-layout">
            <section class="panel keno-grid-panel">
                <div class="keno-grid-header">
                    <span>Wähle 1 bis 10 Runen aus (Gewählt: <strong id="keno-selected-count" style="color:var(--color-gold);">0</strong> / 10)</span>
                    <button type="button" class="btn" id="btn-keno-quickpick" style="font-size:0.75rem; padding:4px 10px; background:rgba(255,215,0,0.1); border-color:rgba(255,215,0,0.3); color:var(--color-gold);">
                        🎲 ZUFALLSWAHL
                    </button>
                    <button type="button" class="btn" id="btn-keno-clear" style="font-size:0.75rem; padding:4px 10px; background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.3); color:var(--color-danger);">
                        🧹 ZURÜCKSETZEN
                    </button>
                </div>

                <div class="keno-board-grid" id="keno-board">
                    <!-- 80 Runes populated by JS -->
                </div>
            </section>

            <!-- PAYTABLE & CONTROLS -->
            <section class="panel keno-controls-panel">
                <h3 style="margin:0 0 10px 0; font-family:'Cinzel',serif; color:var(--color-gold); font-size:1rem;"><i class="fa-solid fa-table-list"></i> Auszahlungstabelle</h3>
                <div class="keno-paytable" id="keno-paytable">
                    <!-- Populated by JS -->
                </div>

                <div class="bet-input-row" style="margin-top:20px; display:flex; flex-direction:column; gap:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label style="font-weight:700;">Einsatz:</label>
                        <input type="number" id="keno-bet-input" value="10.00" min="2" max="500" step="2" style="padding:8px 12px; border-radius:8px; border:1px solid var(--border-color); font-weight:800; font-size:1rem; width:120px; text-align:center;">
                    </div>

                    <button type="button" class="btn" id="btn-draw-keno" style="padding:14px; background:linear-gradient(135deg, #10b981, #047857); color:#fff; font-weight:800; font-size:1.1rem; border:none; border-radius:10px;">
                        <i class="fa-solid fa-play"></i> 20 RUNEN ZIEHEN
                    </button>

                    <button type="button" class="btn btn-icon" id="btn-pf-verify" title="Provably Fair Verifizierung" style="background:rgba(255,215,0,0.1); border-color:rgba(255,215,0,0.3); color:var(--color-gold); margin-top:5px;">
                        <i class="fa-solid fa-shield-halved"></i> Fairness verifizieren
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script src="../shared.js"></script>
    <script src="app.js"></script>
</body>
</html>
