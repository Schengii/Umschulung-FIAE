<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      margin: 0 0 14px 0;
    }
    .btn {
      display: block;
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <h3>📌 JobMatch Clipper</h3>
  <p>Liest die aktuelle Stellenanzeige aus und überträgt Titel, Firma und Text automatisch in dein lokales JobMatch-Board.</p>
  <button class="btn" id="clipBtn">Stelle jetzt clippen</button>

  <script src="popup.js"></script>
</body>
</html>
