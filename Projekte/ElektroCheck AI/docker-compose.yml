version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: electrocheck-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ./backend
    container_name: electrocheck-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
      - LOG_LEVEL=info
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ./
    container_name: electrocheck-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
