version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: electrocheck-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: electrocheck-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - APP_ACCESS_TOKEN=${APP_ACCESS_TOKEN}
      - AUTH_ALLOWED_EMAILS=${AUTH_ALLOWED_EMAILS}
      - AUTH_ADMIN_EMAILS=${AUTH_ADMIN_EMAILS}
      - APP_URL=${APP_URL:-http://localhost:5173}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - TICKETS_FILE=/data/tickets.json
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
      - LOG_LEVEL=info
    volumes:
      - tickets-data:/data
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ./
    container_name: electrocheck-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  tickets-data:
