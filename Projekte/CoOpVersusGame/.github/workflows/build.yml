name: Godot Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Godot
        uses: firebelley/setup-godot@v2
        with:
          version: "4.2"
      - name: Export Windows
        run: |
          godot --headless --export "Windows Desktop" ./build/CoOpVersusGame.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-build
          path: ./build/CoOpVersusGame.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Godot
        uses: firebelley/setup-godot@v2
        with:
          version: "4.2"
      - name: Export Android
        run: |
          godot --headless --export "Android" ./build/CoOpVersusGame.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-build
          path: ./build/CoOpVersusGame.apk
