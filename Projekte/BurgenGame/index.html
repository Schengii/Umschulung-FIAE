<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Empire Classic - Casual Castle Builder</title>
  <meta name="description" content="Baue deine Burg, rekrutiere Ritter und erobere Raubritterburgen in diesem mittelalterlichen Aufbauspiel!">
  
  <!-- Premium Medieval and modern Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&family=MedievalSharp&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/index.css">

    <div id="canvas-container">
